name: PhotoSearch
options:
  bundleIdPrefix: com.photosearch
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"

packages:
  RustCoreSwift:
    path: ../RustCore/RustCoreSwift

targets:
  PhotoSearch:
    type: application
    platform: macOS
    sources:
      - path: PhotoSearch
        excludes:
          - "**/.DS_Store"
    dependencies:
      - package: RustCoreSwift
        product: RustCoreSwift
      # System frameworks the Rust static lib depends on (reqwest/hyper-util
      # use SystemConfiguration for macOS proxy detection; Security for TLS).
      - sdk: SystemConfiguration.framework
      - sdk: Security.framework
    preBuildScripts:
      - name: Build Rust Core
        # Rebuild the Rust library + regenerate the Swift package on every build.
        # Cargo's incremental compilation makes the no-change case ~instant.
        # `basedOnDependencyAnalysis: false` ensures the script always runs
        # (Xcode would otherwise skip it because we don't declare file deps).
        script: |
          "$SRCROOT/../scripts/build_rust.sh"
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.photosearch.app
        PRODUCT_NAME: PhotoSearch
        INFOPLIST_GENERATION_MODE: GeneratedFile
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_EMIT_LOC_STRINGS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
    entitlements:
      path: PhotoSearch/PhotoSearch.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.network.client: true

  PhotoSearchTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: PhotoSearchTests
        excludes:
          - "**/.DS_Store"
    dependencies:
      - target: PhotoSearch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.photosearch.tests
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/PhotoSearch.app/Contents/MacOS/PhotoSearch"

schemes:
  PhotoSearch:
    build:
      targets:
        PhotoSearch: all
        PhotoSearchTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PhotoSearchTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
