name: PhotoSearch
options:
  bundleIdPrefix: com.photosearch
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"

targets:
  PhotoSearch:
    type: application
    platform: macOS
    sources:
      - path: PhotoSearch
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.photosearch.app
        PRODUCT_NAME: PhotoSearch
        INFOPLIST_GENERATION_MODE: GeneratedFile
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_EMIT_LOC_STRINGS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
    entitlements:
      path: PhotoSearch/PhotoSearch.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.network.client: true

  PhotoSearchTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: PhotoSearchTests
        excludes:
          - "**/.DS_Store"
    dependencies:
      - target: PhotoSearch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.photosearch.tests
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/PhotoSearch.app/Contents/MacOS/PhotoSearch"

schemes:
  PhotoSearch:
    build:
      targets:
        PhotoSearch: all
        PhotoSearchTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PhotoSearchTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
