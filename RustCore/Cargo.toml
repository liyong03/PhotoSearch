[package]
name = "rust_core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib", "lib"]
name = "rust_core"

[features]
default = ["metal"]
metal = [
    "candle/metal",
    "candle-nn/metal",
    "candle-transformers/metal",
]
accelerate = [
    "candle/accelerate",
    "candle-nn/accelerate",
    "candle-transformers/accelerate",
]

[dependencies]
# ML inference
candle = { package = "candle-core", version = "0.9.2" }
candle-nn = "0.9.2"
candle-transformers = "0.9.2"

# Model downloading
hf-hub = "0.4.1"

# Tokenizer
tokenizers = { version = "0.21", default-features = false, features = ["fancy-regex"] }

# Image processing
image = "0.25"

# Vector math
ndarray = "0.16"

# Database
rusqlite = { version = "0.33", features = ["bundled-full"] }

# HTTP client (for geocoding)
reqwest = { version = "0.12", features = ["json", "blocking"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Swift interop
uniffi = { version = "0.29", features = ["cli"] }

# Error handling
anyhow = "1"
thiserror = "2"

# Logging
log = "0.4"
env_logger = "0.11"

# Regex (query parsing)
regex = "1"

# LRU cache
lru = "0.13"

# EXIF metadata
kamadak-exif = "0.6.1"

# Date/time parsing
chrono = "0.4"

[build-dependencies]
uniffi = { version = "0.29", features = ["build"] }

[dev-dependencies]
tempfile = "3"
rusqlite = { version = "0.33", features = ["bundled-full"] }
